name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # 每周一次全量：push 到 main 也按路径过滤后，靠它在缓存被淘汰后重新建起来
  schedule:
    - cron: "41 19 * * 0" # 周一 03:41（北京时间）
  workflow_dispatch:

concurrency:
  # 带上事件名：定时全量和 push 到 main 都在 refs/heads/main 上，别互相取消
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # 定时 / 手动运行不过滤（过滤步骤被跳过、输出为空），一律当作两边都有改动
      frontend: ${{ steps.filter.outputs.frontend || 'true' }}
      backend: ${{ steps.filter.outputs.backend || 'true' }}
    steps:
      # On pull_request the filter reads changed files via the API (no checkout);
      # on push it needs a local git history to diff against.
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v6

      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            frontend:
              - "src/**"
              - "tests/**"
              - "index.html"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "tsconfig.json"
              - "tsconfig.node.json"
              - "vite.config.ts"
              - "vitest.config.ts"
              - "tailwind.config.cjs"
              - "postcss.config.cjs"
              - "components.json"
              - ".github/workflows/**"
            backend:
              # 拆分后后端代码在 crates/**：只列 src-tauri 会让 core/CLI 的改动
              # 完全不触发后端 job（core 单测、clippy、CLI 构建都跑不到）。
              - "src-tauri/**"
              - "crates/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".github/workflows/**"

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    needs: changes
    # PR 和 push 到 main 都按路径过滤。缓存 key 精确命中时不会重存，main 全量跑并不能
    # 预热什么；缓存被淘汰后由每周的定时全量重建。
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Check formatting
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test:unit

      - name: Build frontend
        run: pnpm build:renderer

  backend:
    name: Backend Checks
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # rust-toolchain.toml 是编译器版本的唯一来源：直接装它，免得先装 stable 再被 rustup 换掉
      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      # 只缓存依赖：本仓库的 crate 每次都要重编，缓存它只会让缓存变大、恢复变慢。
      # key 自带 OS、rustc 版本和 Cargo.lock；shared-key 让 WSL2 job 能读到 Windows 这份。
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # core / CLI 不在 workspace 里，各编各的 target：只登记 src-tauri 的话
          # 这两个 crate 的依赖每次都要重编（缓存命中率 0）。
          workspaces: |
            src-tauri -> target
            crates/cc-switch-core -> crates/cc-switch-core/target
            crates/cc-switch-cli -> crates/cc-switch-cli/target
          shared-key: backend

      - name: Install cargo-nextest
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-nextest

      - name: Create frontend dist placeholder
        shell: bash
        run: mkdir -p dist

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      # 每个测试一个进程，单测超时见 src-tauri/.config/nextest.toml。doctest 目前只有两个
      # ignored，nextest 不跑 doctest 也不漏。
      - name: Run tests
        run: cargo nextest run --manifest-path src-tauri/Cargo.toml --profile ci

      # ---------------------------------------------------------------
      # 拆分出来的 core / CLI：上面的 fmt/clippy/nextest 只覆盖 src-tauri，
      # crates/** 需要单独跑，否则 core 的改动不经过任何格式化/静态检查。
      # ---------------------------------------------------------------
      - name: Core formatting
        run: cargo fmt --check --manifest-path crates/cc-switch-core/Cargo.toml
      - name: Core clippy
        # 先不 -D warnings：core 之前从没单独跑过 clippy，存量告警清完再收紧。
        run: cargo clippy --manifest-path crates/cc-switch-core/Cargo.toml --all-targets

      # 手册的第二档验证：CLI 用 default-features = false，core 必须在无
      # session-monitor 时也能 check / 编译测试（门控不彻底会在这里暴露）。
      - name: Core check (no default features)
        run: cargo check --manifest-path crates/cc-switch-core/Cargo.toml --no-default-features

      - name: Core tests compile (no default features)
        run: cargo test --manifest-path crates/cc-switch-core/Cargo.toml --no-default-features --no-run

      - name: Core tests
        run: cargo nextest run --manifest-path crates/cc-switch-core/Cargo.toml

      - name: CLI check
        run: cargo check --manifest-path crates/cc-switch-cli/Cargo.toml

      - name: CLI formatting
        run: cargo fmt --check --manifest-path crates/cc-switch-cli/Cargo.toml

  backend-windows-wsl2:
    name: Backend Checks (Windows + WSL2 home)
    runs-on: windows-2025
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Setup WSL2
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: python3

      # 只恢复不保存：这里只编 lib 测试，若由它先存，同 key 的 Windows 缓存就只剩一小半。
      # 完整缓存由 backend 矩阵的 Windows job 保存（同一个 shared-key）。
      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # core / CLI 不在 workspace 里，各编各的 target：只登记 src-tauri 的话
          # 这两个 crate 的依赖每次都要重编（缓存命中率 0）。
          workspaces: |
            src-tauri -> target
            crates/cc-switch-core -> crates/cc-switch-core/target
            crates/cc-switch-cli -> crates/cc-switch-cli/target
          shared-key: backend
          save-if: false

      - name: Create frontend dist placeholder
        shell: bash
        run: mkdir -p dist

      - name: Prepare WSL2-backed test environment
        shell: pwsh
        run: |
          wsl.exe -d Ubuntu-24.04 -- bash -lc "rm -rf /tmp/cc-switch-windows-test-root && mkdir -p /tmp/cc-switch-windows-test-root/{home,temp} && chmod -R 0777 /tmp/cc-switch-windows-test-root"
          $testRoot = "\\wsl.localhost\Ubuntu-24.04\tmp\cc-switch-windows-test-root"
          $testHome = Join-Path $testRoot "home"
          $testTemp = Join-Path $testRoot "temp"
          foreach ($path in @($testRoot, $testHome, $testTemp)) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "WSL2-backed test path is unavailable: $path"
            }
          }
          "CC_SWITCH_TEST_HOME=$testHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_SWITCH_WSL_TEST_DIR=$testRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_SWITCH_WSL_TEST_TEMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile backend tests with native temp
        # link.exe/mt.exe cannot create manifests when TEMP points at a WSL UNC path.
        # Record the built test binary paths so the run steps below can execute
        # them directly instead of re-invoking cargo with TEMP on \\wsl.localhost.
        #
        # 两个二进制都要编：WSL2 契约测试（core/src/config.rs、hermes.rs）在拆分后
        # 属于 cc_switch_core，GUI 的 cc_switch_lib 里已经找不到它们。
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        shell: pwsh
        run: |
          function Find-TestBinary([string]$manifest, [string]$targetName) {
            $binary = cargo test --lib --manifest-path $manifest --no-run --message-format=json |
              ForEach-Object {
                if ($_ -match '"reason":"compiler-artifact"') {
                  $artifact = $_ | ConvertFrom-Json
                  if ($artifact.executable -and $artifact.profile.test -and $artifact.target.name -eq $targetName) {
                    $artifact.executable
                  }
                }
              } | Select-Object -First 1 -Wait
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not $binary) { throw "$targetName test binary not found in cargo compiler artifacts" }
            return $binary
          }
          $testBinary = Find-TestBinary 'src-tauri/Cargo.toml' 'cc_switch_lib'
          $coreTestBinary = Find-TestBinary 'crates/cc-switch-core/Cargo.toml' 'cc_switch_core'
          "CC_SWITCH_TEST_EXE=$testBinary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_SWITCH_CORE_TEST_EXE=$coreTestBinary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Windows-to-WSL2 filesystem contract
        # Run the test binary built in the previous step directly. Invoking cargo
        # here with TEMP pointing at a WSL UNC path can re-link the crate, and
        # link.exe/mt.exe cannot create manifest temp files on \\wsl.localhost.
        shell: pwsh
        run: |
          $env:TEMP = $env:CC_SWITCH_WSL_TEST_TEMP
          $env:TMP = $env:CC_SWITCH_WSL_TEST_TEMP
          $testName = "config::tests::atomic_write_replaces_existing_wsl_unc_file"
          $testList = & $env:CC_SWITCH_CORE_TEST_EXE --list --ignored
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $expected = "${testName}: test"
          if ($testList -notcontains $expected) {
            throw "Expected ignored test was not discovered: $testName"
          }
          & $env:CC_SWITCH_CORE_TEST_EXE $testName --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run Hermes live WAL reads inside WSL2
        env:
          CC_SWITCH_WSL_DISTRO: Ubuntu-24.04
        shell: pwsh
        run: |
          $testName = "session_manager::providers::hermes::tests::wsl2_live_wal_readonly_reference"
          $testList = & $env:CC_SWITCH_CORE_TEST_EXE --list --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($testList -notcontains "${testName}: test") { throw "Hermes WSL test not discovered" }
          & $env:CC_SWITCH_CORE_TEST_EXE $testName --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
