name: Release

on:
  # 推 tag 直接发布：检查 →（签名）→ 打包 → 创建/更新 GitHub Release
  # 产物：Windows MSI + 便携版 zip；Linux 绿色压缩包（仅含 GUI）+ 独立 CLI 文件。
  # 不产 .deb；只有 Windows 安装包在配置了签名密钥时额外带 .sig 和 latest.json。
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # 应用内更新摘要（src/whats-new/<版本>.json，见同目录 README）随安装包发出。
  # 漏写不再挡发布（弹窗只是空着）；结构写坏仍然挡——弹窗渲染出错会让
  # 整个应用落进错误页。
  whats-new-check:
    name: Check in-app what's new summaries
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check this version's summary (warn only)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          file="src/whats-new/${TAG#v}.json"
          if [ ! -f "$file" ]; then
            echo "::warning file=$file::Missing $file. The in-app upgrade popup will be empty for $TAG; add it (\"items\": [] to skip the popup, see src/whats-new/README.md)."
          else
            echo "Summary present: $file"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Validate all summaries
        run: pnpm vitest run tests/config/whatsNewEntries.test.ts

  release:
    needs: whats-new-check
    runs-on: ${{ matrix.os }}
    # fork 可能没有 updater 私钥：没有就发无签名版（无 .sig、无 latest.json）
    env:
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
          - os: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # rust-toolchain.toml 是编译器版本的唯一来源：直接装它，免得先装 stable 再被 rustup 换掉
      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          # Core build tools and pkg-config
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            patchelf \
            libssl-dev
          # GTK/GLib stack for gdk-3.0, glib-2.0, gio-2.0
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev
          # WebKit2GTK (version differs across Ubuntu images; try 4.1 then 4.0)
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          # libsoup also changed major version; prefer 3.0 with fallback to 2.4
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          node --version
          pnpm --version

      - name: Get pnpm store directory
        if: runner.os != 'Windows'
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        if: runner.os != 'Windows'
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Prepare Tauri signing key
        if: env.HAS_SIGNING_KEY == 'true'
        uses: ./.github/actions/prepare-tauri-signing-key
        with:
          private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build Tauri App (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 只打 MSI 安装器（和便携版 exe），不打用不上的 NSIS 安装包
          if ($env:HAS_SIGNING_KEY -eq 'true') {
            pnpm tauri build --bundles msi
          } else {
            # fork 没配 updater 私钥：关掉 updater 产物，否则 Tauri CLI 见到 pubkey
            # 就强制要 TAURI_SIGNING_PRIVATE_KEY，构建阶段直接失败，走不到后面
            # "发无签名版"的降级逻辑。
            $config = Join-Path $env:RUNNER_TEMP 'no-updater.json'
            '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Encoding utf8 $config
            pnpm tauri build --bundles msi --config "$config"
          }

      - name: Build Tauri App (Linux)
        if: runner.os == 'Linux'
        run: |
          # Linux 只出绿色压缩包：不构建 .deb，也不生成 updater 产物（无签名需求）。
          printf '%s' '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/no-updater.json"
          pnpm tauri build --no-bundle --config "$RUNNER_TEMP/no-updater.json"

      - name: Build CLI (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --manifest-path crates/cc-switch-cli/Cargo.toml

      - name: Prepare Windows Assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          # e.g., v4.0.25；tag 里若有斜杠会被当成目录，换成 -
          $VERSION = $env:GITHUB_REF_NAME -replace '/', '-'
          $targetRoot = 'src-tauri/target/release'
          $assetSuffix = ''
          # 配置了签名密钥才要求 .sig，否则发无签名版
          $requireSig = $env:HAS_SIGNING_KEY -eq 'true'

          # 仅打包 MSI 安装器 + .sig（用于 Updater）
          $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle/msi') -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $msi) {
            # 兜底：全局搜索 .msi
            $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle') -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($null -ne $msi) {
            # #8534：旧版本的应用内更新器以 `msiexec /passive /promptrestart` 安装、不带任何 REBOOT
            # 选项，文件被占用时会不经提示直接重启系统，所以 MSI 自身必须带 REBOOT=ReallySuppress。
            $installer = New-Object -ComObject WindowsInstaller.Installer
            $db = $installer.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $installer, @($msi.FullName, 0))
            $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @('SELECT `Value` FROM `Property` WHERE `Property`=''REBOOT'''))
            $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null) | Out-Null
            $record = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
            $reboot = if ($null -ne $record) { $record.GetType().InvokeMember('StringData', 'GetProperty', $null, $record, 1) } else { $null }
            $view.GetType().InvokeMember('Close', 'InvokeMethod', $null, $view, $null) | Out-Null
            if ($reboot -ne 'ReallySuppress') {
              throw "MSI Property table must set REBOOT=ReallySuppress (found: '$reboot') - see #8534"
            }
            Write-Host "MSI REBOOT property: $reboot"

            $dest = "CC-Switch-$VERSION-Windows$assetSuffix.msi"
            Copy-Item $msi.FullName (Join-Path release-assets $dest)
            Write-Host "Installer copied: $dest"
            $sigPath = "$($msi.FullName).sig"
            if (Test-Path $sigPath) {
              Copy-Item $sigPath (Join-Path release-assets ("$dest.sig"))
              Write-Host "Signature copied: $dest.sig"
            } elseif ($requireSig) {
              throw "Signature not found for $($msi.Name)"
            } else {
              Write-Warning 'No updater signature (signing key not configured); publishing without .sig'
            }
          } else {
            throw "No Windows MSI installer found"
          }

          # 绿色版（portable）：仅可执行文件打 zip（不参与 Updater）
          $exeCandidates = @(
            'src-tauri/target/release/cc-switch.exe',
            'src-tauri/target/x86_64-pc-windows-msvc/release/cc-switch.exe'
          )
          $exePath = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($null -ne $exePath) {
            $portableDir = 'release-assets/CC-Switch-Portable'
            New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
            Copy-Item $exePath $portableDir
            $portableIniPath = Join-Path $portableDir 'portable.ini'
            $portableContent = @(
              '# CC Switch portable build marker',
              'portable=true'
            )
            $portableContent | Set-Content -Path $portableIniPath -Encoding UTF8
            $portableZip = "release-assets/CC-Switch-$VERSION-Windows$assetSuffix-Portable.zip"
            Compress-Archive -Path "$portableDir/*" -DestinationPath $portableZip -Force
            Remove-Item -Recurse -Force $portableDir
            Write-Host "Windows portable zip created: CC-Switch-$VERSION-Windows$assetSuffix-Portable.zip"
          } else {
            Write-Warning 'Portable exe not found'
          }

      - name: Prepare Linux Assets
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          # e.g., v4.0.26；tag 里若有斜杠会被当成目录，换成 -
          VERSION="${GITHUB_REF_NAME//\//-}"
          ARCH="x86_64"
          NAME="CC-Switch-${VERSION}-Ubuntu-${ARCH}"

          # --no-bundle 只出可执行文件；压缩包里只放 GUI，CLI 作为独立文件单独发布。
          GUI=$(find src-tauri/target/release -maxdepth 1 -type f -name cc-switch -perm -u+x | head -1 || true)
          if [ -z "$GUI" ]; then
            echo "❌ GUI binary not found under src-tauri/target/release" >&2
            exit 1
          fi
          CLI="crates/cc-switch-cli/target/release/cc-switch-cli"
          if [ ! -f "$CLI" ]; then
            echo "❌ CLI binary not found: $CLI" >&2
            exit 1
          fi

          STAGE_ROOT="$(mktemp -d)"
          STAGE="$STAGE_ROOT/$NAME"
          mkdir -p "$STAGE"
          cp "$GUI" "$STAGE/cc-switch"
          chmod +x "$STAGE/cc-switch"
          # CLI 不进压缩包：直接作为独立的 release asset 上传。
          cp "$CLI" "release-assets/cc-switch-cli"
          chmod +x "release-assets/cc-switch-cli"
          {
            echo "CC Switch - Ubuntu / Linux x86_64 portable archive"
            echo ""
            echo "- cc-switch  GUI (Tauri; needs WebKitGTK 4.1 and libayatana-appindicator3)"
            echo ""
            echo "Run ./cc-switch directly."
            echo "The CLI (cc-switch-cli) is a separate download on the release page."
            echo "No .deb and no in-app updates: download new releases manually."
          } > "$STAGE/README.txt"
          tar -czf "release-assets/${NAME}.tar.gz" -C "$STAGE_ROOT" "$NAME"
          rm -rf "$STAGE_ROOT"
          echo "Archive created: ${NAME}.tar.gz (GUI only)"
          echo "CLI asset created: cc-switch-cli (standalone)"

      - name: List prepared assets
        shell: bash
        run: |
          ls -la release-assets
          echo "Collected signatures (if any alongside artifacts):"
          ls -la release-assets/*.sig || echo "No signatures found (signing key not configured)"

      - name: Upload release artifacts to workflow
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ runner.os }}-${{ runner.arch }}
          path: release-assets/*
          if-no-files-found: error

      - name: List generated bundles (debug)
        if: always()
        shell: bash
        run: |
          echo "Listing bundles in src-tauri/target..."
          find src-tauri/target -maxdepth 4 -type f -name "*.*" 2>/dev/null || true

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: [release]
    permissions:
      contents: write
    steps:
      - name: Download built release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: List downloaded release artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -la release-assets

      # Linux 改发压缩包、不参与应用内更新；只有 Windows MSI 带 .sig 时生成
      # latest.json（仅 windows-x86_64）。没有签名密钥时产物里没有 .sig——
      # 跳过 latest.json，安装包照常发布。
      - name: Generate latest.json
        env:
          # 本 fork 的 updater 端点固定指向 Lemon00/cc-switch（见
          # tauri.conf.json），清单里的下载地址必须和它是同一个仓库；
          # 不能用 github.repository，否则从别的 fork 触发会写出对不上的 URL。
          REPO: Lemon00/cc-switch
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! ls release-assets/*.sig >/dev/null 2>&1; then
            echo "WARNING: no .sig in release-assets (signing key not configured); skipping latest.json — in-app updates will be unavailable"
            exit 0
          fi
          VERSION="${TAG#v}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          base_url="https://github.com/$REPO/releases/download/$TAG"
          win_x64_url=""; win_x64_sig=""
          shopt -s nullglob
          for sig in release-assets/*.sig; do
            base=${sig%.sig}
            fname=$(basename "$base")
            url="$base_url/$fname"
            sig_content=$(cat "$sig")
            case "$fname" in
              *-Windows.msi)
                win_x64_url="$url"; win_x64_sig="$sig_content";;
            esac
          done
          if [ -z "$win_x64_sig" ]; then
            echo "❌ Missing updater signature for windows-x86_64" >&2
            exit 1
          fi
          # 构造 JSON
          tmp_json=$(mktemp)
          {
            echo '{'
            echo "  \"version\": \"$VERSION\",";
            echo "  \"notes\": \"Release $TAG\",";
            echo "  \"pub_date\": \"$PUB_DATE\",";
            echo '  "platforms": {'
            echo "    \"windows-x86_64\": {\"signature\": \"$win_x64_sig\", \"url\": \"$win_x64_url\"}"
            echo '  }'
            echo '}'
          } > "$tmp_json"
          echo "Generated latest.json:" && cat "$tmp_json"
          mv "$tmp_json" release-assets/latest.json

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: CC Switch ${{ github.ref_name }}
          prerelease: true
          body: |
            ## CC Switch ${{ github.ref_name }}

            🌐 **Only Official Website / 唯一官方网站 / 唯一の公式サイト**: [ccswitch.io](https://ccswitch.io)

            Claude Code 供应商切换工具

            ### 下载

            - **Windows (x86_64)**: `CC-Switch-${{ github.ref_name }}-Windows.msi`（安装版）或 `CC-Switch-${{ github.ref_name }}-Windows-Portable.zip`（绿色版）
            - **Ubuntu / Linux (x86_64)**: `CC-Switch-${{ github.ref_name }}-Ubuntu-x86_64.tar.gz`（绿色压缩包，**仅含 GUI** `cc-switch`；需系统已装 WebKitGTK 4.1 等运行库）
            - **Linux CLI (x86_64)**: `cc-switch-cli`（独立可执行文件，单独下载；`chmod +x cc-switch-cli` 后 `./cc-switch-cli --help`）

            > Linux 不提供 .deb，也不参与应用内自动更新；`.sig` / `latest.json` 仅用于 Windows 安装版的更新签名。
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
