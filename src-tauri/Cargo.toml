[package]
name = "cc-switch"
version = "4.0.27"
description = "All-in-One Assistant for Claude Code, Codex & Gemini CLI"
authors = ["Jason Young"]
license = "MIT"
repository = "https://github.com/Lemon00/cc-switch"
edition = "2021"
rust-version = "1.85.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "cc_switch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[features]
# GUI 需要会话聚合（仪表盘）；核心同名 feature 由这里转发，不再靠「核心默认开」
# 兜底，否则 shim 里被门控模块的重导出会永远编得过、问题被藏起来。
default = ["session-monitor"]
test-hooks = []
session-monitor = ["cc-switch-core/session-monitor"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
# 后端核心：数据库、供应商、代理、live、mode 等。默认 feature 由本 crate
# 的 session-monitor 转发（见 [features]），核心不再默认开。
cc-switch-core = { path = "../crates/cc-switch-core", default-features = false }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tauri = { version = "2.8.2", features = ["tray-icon", "protocol-asset", "image-png", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
dirs = "5.0"
toml = "0.8"
toml_edit = "0.22"
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream", "socks"] }
arboard = "3.6"
zstd = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "process", "signal"] }
futures = "0.3"
# Keep legacy SSE support alongside Streamable HTTP; newer SDKs removed SSE.
rmcp = { version = "0.8.5", features = ["client", "transport-async-rw", "transport-sse-client-reqwest", "transport-streamable-http-client-reqwest"] }
process-wrap = { version = "8.2", features = ["tokio1"] }
async-stream = "0.3"
bytes = "1.5"
axum = "0.7"
http = "1"
rustls = "0.23"
regex = "1.10"
thiserror = "2.0"
anyhow = "1.0"
zip = "2.2"
tempfile = "3"
url = "2.5"
auto-launch = "0.5"
once_cell = "1.21.3"
base64 = "0.22"
# 校验自定义供应商图标；tauri 经 image 已依赖同一版本，不增加编译量
png = "0.18"
rusqlite = { version = "0.31", features = ["bundled", "backup", "hooks"] }
indexmap = { version = "2", features = ["serde"] }
uuid = { version = "1.11", features = ["v4"] }
sha2 = "0.10"
subtle = "2.6"
json-five = "0.3.1"
sys-locale = "0.3"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.1", features = ["v2_16"] }
gtk = "0.18"

[target.'cfg(not(target_os = "windows"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
webview2-com = "0.38"
windows = "0.61"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSColor"] }
# 托盘面板的原生玻璃：NSGlassEffectView（macOS 26）/ NSVisualEffectView；0.2 那套没有前者
objc2-06 = { package = "objc2", version = "0.6" }
objc2-foundation-03 = { package = "objc2-foundation", version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSString"] }
objc2-app-kit-03 = { package = "objc2-app-kit", version = "0.3", default-features = false, features = ["std", "NSAppearance", "NSGlassEffectView", "NSGraphics", "NSResponder", "NSScreen", "NSView", "NSVisualEffectView", "NSWindow"] }

# Optimize release binary size to help reduce AppImage footprint
[profile.release]
# 主 crate 体量大，codegen-units = 1 时 LLVM 只能单线程跑，发布编译的大头都在它身上。
# 16 让主 crate 编译快约 64%，代价是二进制体积增加约 17%（10-05 本机基准）。
codegen-units = 16
lto = "thin"
opt-level = "s"
# 使用 unwind 以便 panic hook 能捕获 backtrace（abort 会直接终止无法捕获）
panic = "unwind"
strip = "symbols"

[dev-dependencies]
# 只给 cargo test 开：让 GUI 测试能用核心的测试辅助；正常构建不启用。
# default-features = false：feature 仍由本 crate 的 session-monitor 转发，
# 与正常构建保持一致（`cargo test --no-default-features` 才真正关掉会话聚合）。
cc-switch-core = { path = "../crates/cc-switch-core", default-features = false, features = ["test-support"] }
serial_test = "3"
# 只被 src-tauri/tests 的 yaml 断言用到，业务代码不再直接依赖（解析已搬到 core）。
serde_yaml = "0.9"
tauri = { version = "2.8.2", features = ["test"] }
tokio = { version = "1", features = ["test-util"] }
